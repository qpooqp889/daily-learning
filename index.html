<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 每日學習</title>
<style>
:root {
  --bg: #f0f6ff;              /* 白天：淺藍背景 */
  --card: #ffffff;
  --text: #1a2b4a;
  --muted: #5a7399;
  --primary: #1e6fd9;         /* 藍 */
  --primary-dark: #155bb5;
  --border: #cfe0f7;
  --chip: #e3efff;
  --danger: #d93025;
  --shadow: 0 2px 10px rgba(30, 111, 217, 0.08);
}
[data-theme="dark"] {
  --bg: #120b0e;              /* 黑夜：黑底 */
  --card: #1e1419;
  --text: #ffd9ec;            /* 桃紅系文字 */
  --muted: #c98aa9;
  --primary: #ff3d8b;         /* 桃紅 */
  --primary-dark: #e02475;
  --border: #4a2438;
  --chip: #331a28;
  --danger: #ff6b6b;
  --shadow: 0 2px 12px rgba(255, 61, 139, 0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  background: var(--bg); color: var(--text);
  transition: background .3s, color .3s;
  min-height: 100vh;
}
/* ---------- 桌面 header ---------- */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px; background: var(--card);
  border-bottom: 1px solid var(--border); box-shadow: var(--shadow);
  position: sticky; top: 0; z-index: 10;
}
header h1 { font-size: 22px; }
header .stats { font-size: 14px; color: var(--muted); margin-left: 16px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab-btn {
  padding: 8px 20px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--card); color: var(--muted); cursor: pointer; font-size: 15px;
  transition: all .2s;
}
.tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
#themeToggle {
  padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); cursor: pointer; font-size: 14px;
}
#themeToggle:hover { border-color: var(--primary); }

/* ---------- 手機 hamburger 折疊式 top bar ---------- */
.mobile-header {
  display: none;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}
.mobile-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
}
.mobile-bar h1 { font-size: 20px; }
#hamburger {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); cursor: pointer; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .2s;
}
#hamburger:hover { border-color: var(--primary); }
.mobile-drawer {
  max-height: 0; overflow: hidden;
  transition: max-height .3s ease;
  background: var(--card);
  border-top: 0 solid var(--border);
}
.mobile-drawer.open {
  max-height: 320px;
  border-top: 1px solid var(--border);
}
.mobile-tabs {
  display: flex; flex-direction: column; gap: 4px;
  padding: 10px 16px 14px;
}
.mobile-tabs .tab-btn {
  width: 100%; text-align: left; border-radius: 12px;
  padding: 10px 16px;
}
.mobile-tabs .tab-btn.active {
  background: var(--primary); color: #fff; border-color: var(--primary);
}
.mobile-theme {
  padding: 0 16px 12px; border-top: 1px solid var(--border); margin-top: 4px; padding-top: 10px;
}

@media (max-width: 600px) {
  header { display: none; }
  .mobile-header { display: block; }
  .search-bar { padding: 0 16px; }
}
.search-bar { max-width: 900px; margin: 16px auto 0; padding: 0 20px; }
#searchInput {
  width: 100%; padding: 10px 16px; border-radius: 24px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 15px; outline: none;
}
#searchInput:focus { border-color: var(--primary); }
main { max-width: 900px; margin: 16px auto 24px; padding: 0 20px; }
.page { display: none; }
.page.active { display: block; }
.section-title { font-size: 18px; margin: 20px 0 12px; display: flex; align-items: center; gap: 8px; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.word-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.word { font-size: 20px; font-weight: 700; color: var(--primary); }
.pos { font-size: 13px; color: var(--muted); background: var(--chip); padding: 2px 8px; border-radius: 10px; }
.meaning { font-size: 15px; }
.link-btn {
  display: inline-block; font-size: 12px; text-decoration: none; color: var(--primary);
  border: 1px solid var(--primary); border-radius: 10px; padding: 2px 8px; margin-left: 6px;
  transition: all .2s;
}
.link-btn:hover { background: var(--primary); color: #fff; }
.sentence { margin: 10px 0 6px 8px; padding-left: 12px; border-left: 3px solid var(--primary); }
.sentence .en { font-size: 15px; }
.sentence .zh { font-size: 13px; color: var(--muted); margin-top: 2px; }
.idiom-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.idiom { font-size: 20px; font-weight: 700; color: var(--primary); }
.explanation { font-size: 14px; margin-top: 6px; line-height: 1.6; }
.example { font-size: 14px; margin-top: 8px; color: var(--muted); line-height: 1.6; }
.example::before { content: "✏️ 造句："; color: var(--primary); font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; }
.hit { background: rgba(255, 200, 0, .35); border-radius: 3px; padding: 0 2px; }

/* ---------- A-Z 快查 / 主題分類篩選 ---------- */
.filter-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.filter-label { font-size: 13px; color: var(--muted); margin-right: 4px; }
.alpha-btn {
  width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); cursor: pointer; font-size: 14px; font-weight: 600;
  transition: all .15s;
}
.alpha-btn:hover { border-color: var(--primary); color: var(--primary); }
.alpha-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.topic-chip, .cat-chip {
  padding: 5px 14px; border-radius: 16px; border: 1px solid var(--border);
  background: var(--card); color: var(--muted); cursor: pointer; font-size: 13px; transition: all .2s;
}
.topic-chip.active, .cat-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
.topic-badge, .cat-badge {
  display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px;
  background: var(--chip); color: var(--primary); margin-left: 8px; vertical-align: 2px;
}
.filter-count { font-size: 12px; color: var(--muted); }

/* ---------- 學習計畫 ---------- */
.plan-form-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.plan-config { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
.plan-config .plan-form-row { margin-bottom: 10px; }
.plan-config .plan-form-row:last-child { margin-bottom: 0; }
.plan-form-row label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.plan-form-row label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.plan-config input[type="number"] { width: 64px; }
.plan-form-row input[type="text"], .plan-form-row input[type="date"], .plan-form-row input[type="number"] {
  padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 14px; outline: none;
}
.plan-form-row input:focus { border-color: var(--primary); }
.plan-pick { display: flex; gap: 24px; flex-wrap: wrap; }
.plan-pick > div { flex: 1; min-width: 260px; }
.plan-pick b { font-size: 15px; }
.pick-list {
  max-height: 220px; overflow-y: auto; border: 1px solid var(--border);
  border-radius: 10px; padding: 8px; margin-top: 8px; background: var(--card);
}
.pick-list label { display: block; padding: 4px 8px; font-size: 14px; cursor: pointer; border-radius: 6px; }
.pick-list label:hover { background: var(--chip); }
.pick-list input { accent-color: var(--primary); margin-right: 6px; }
.mini-btn {
  font-size: 12px; padding: 2px 10px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); color: var(--muted); cursor: pointer; margin-left: 6px;
}
.mini-btn:hover { border-color: var(--primary); color: var(--primary); }
.primary-btn {
  padding: 10px 20px; border-radius: 20px; border: none;
  background: var(--primary); color: #fff; cursor: pointer; font-size: 15px; font-weight: 600;
}
.primary-btn:hover { background: var(--primary-dark); }
.plan-actions { margin-top: 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.plan-toolbar { margin: 16px 0 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ghost-btn {
  padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); cursor: pointer; font-size: 14px;
}
.ghost-btn:hover { border-color: var(--primary); color: var(--primary); }
.plan-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.plan-name { font-size: 17px; font-weight: 700; color: var(--primary); }
.plan-meta { font-size: 13px; color: var(--muted); }
.progress { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; margin: 10px 0; }
.progress > div { height: 100%; background: var(--primary); border-radius: 4px; transition: width .3s; }
.day-row {
  display: flex; align-items: center; gap: 12px; padding: 7px 0;
  border-bottom: 1px dashed var(--border); flex-wrap: wrap;
}
.day-row:last-child { border-bottom: none; }
.day-date { min-width: 105px; font-weight: 600; font-size: 14px; }
.day-items { display: flex; gap: 8px; flex-wrap: wrap; }
.day-item {
  display: inline-flex; align-items: center; gap: 6px; font-size: 14px;
  padding: 3px 10px; border-radius: 14px; background: var(--chip);
}
.day-item input { accent-color: var(--primary); cursor: pointer; }
.day-item.done { opacity: .5; text-decoration: line-through; }
.plan-ctrl { display: flex; gap: 8px; }
.day-word-group { display: flex; flex-direction: column; gap: 2px; }
.day-word-head { display: flex; align-items: center; gap: 4px; }
.day-word-link {
  font-weight: 600; font-size: 14px; cursor: pointer; color: var(--primary);
  text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px;
}
.day-item-group { display: inline-flex; align-items: center; gap: 4px; }
.day-word-link:hover { color: var(--accent); }
.day-expand-btn {
  background: none; border: none; cursor: pointer; font-size: 10px;
  color: var(--muted); padding: 0 2px; line-height: 1;
}
.day-sentences { padding: 4px 0 4px 32px; display: flex; flex-direction: column; gap: 3px; }
.plan-sent-row { display: flex; flex-direction: column; gap: 1px; padding: 2px 0; }
.plan-sent-en { font-size: 13px; color: var(--text); }
.plan-sent-zh { font-size: 12px; color: var(--muted); padding-left: 8px; }
/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,.45); align-items: center; justify-content: center;
  padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal-card {
  background: var(--card); border-radius: 16px; padding: 24px;
  max-width: 560px; width: 100%; max-height: 85vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
.modal-word-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 16px; }
.modal-sentences { border-top: 1px solid var(--border); padding-top: 14px; }
.danger-btn {
  padding: 6px 12px; border-radius: 16px; border: 1px solid var(--danger);
  background: transparent; color: var(--danger); cursor: pointer; font-size: 13px;
}
.danger-btn:hover { background: var(--danger); color: #fff; }
.plan-empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: 14px; }
.expand-btn {
  background: none; border: none; color: var(--primary); cursor: pointer;
  font-size: 13px; padding: 2px 4px;
}
/* ---------- 養成遊戲 ---------- */
.pet-choose { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; padding: 12px 0 6px; }
.pet-choice-btn {
  padding: 18px 24px; border-radius: 16px; border: 2px solid var(--border);
  background: var(--card); color: var(--text); cursor: pointer; font-size: 15px; font-weight: 600;
  transition: all .2s;
}
.pet-choice-btn:hover { border-color: var(--primary); transform: translateY(-3px); }
.pet-choice-btn .emoji { display: block; font-size: 46px; margin-bottom: 6px; }
.pet-head { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.pet-stage { font-size: 74px; animation: bounce 1.4s infinite ease-in-out; line-height: 1; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.pet-info { flex: 1; min-width: 200px; }
.pet-name { font-size: 20px; font-weight: 700; color: var(--primary); }
.pet-level { font-size: 14px; color: var(--muted); margin: 4px 0; }
.pet-xp-text { font-size: 12px; color: var(--muted); }
.pet-actions { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
.pet-msg { margin-top: 10px; font-size: 14px; color: var(--muted); min-height: 20px; }
.chip-btn {
  padding: 6px 16px; border-radius: 16px; border: 1px solid var(--border);
  background: var(--card); color: var(--muted); cursor: pointer; font-size: 14px; transition: all .2s;
}
.chip-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
.quiz-progress { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; margin: 4px 0 8px; }
.quiz-progress > div { height: 100%; background: var(--primary); border-radius: 3px; transition: width .3s; }
.quiz-prompt { font-size: 20px; font-weight: 700; margin: 10px 0 14px; line-height: 1.5; }
.option-btn {
  display: block; width: 100%; text-align: left; padding: 10px 14px;
  border-radius: 10px; border: 1px solid var(--border); background: var(--card);
  color: var(--text); font-size: 15px; cursor: pointer; margin: 6px 0; line-height: 1.5;
  transition: all .15s;
}
.option-btn:hover:not(:disabled) { border-color: var(--primary); }
.option-btn:disabled { cursor: default; }
.option-btn.correct { background: #d4edda; border-color: #28a745; color: #155724; font-weight: 600; }
[data-theme="dark"] .option-btn.correct { background: #1e3a2a; color: #7ee2a8; border-color: #28a745; }
.option-btn.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
[data-theme="dark"] .option-btn.wrong { background: #3a1e1e; color: #ff9b9b; border-color: #dc3545; }
.result-card { text-align: center; padding: 16px 0; }

@media (max-width: 600px) {
  header { flex-wrap: wrap; gap: 8px; }
  header .stats { width: 100%; margin-left: 0; }
}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:8px;">
    <h1>📚 每日學習</h1>
    <span class="stats" id="stats"></span>
  </div>
  <div class="header-right">
    <div class="tabs">
      <button class="tab-btn active" data-tab="en">🇺🇸 英文</button>
      <button class="tab-btn" data-tab="cn">🀄 國語</button>
      <button class="tab-btn" data-tab="fav">⭐ 收藏</button>
      <button class="tab-btn" data-tab="plan">📅 學習計畫</button>
      <button class="tab-btn" data-tab="pet">🎮 養成遊戲</button>
    </div>
    <button id="themeToggle">🌙 黑夜模式</button>
  </div>
</header>

<!-- 手機版折疊式 top bar -->
<div class="mobile-header">
  <div class="mobile-bar">
    <div>
      <h1>📚 每日學習</h1>
      <div id="statsMobile" style="font-size:12px;color:var(--muted);margin-top:2px;"></div>
    </div>
    <button id="hamburger">☰</button>
  </div>
  <div class="mobile-drawer" id="mobileDrawer">
    <div class="mobile-tabs" id="mobileTabs">
      <button class="tab-btn active" data-tab="en">🇺🇸 英文</button>
      <button class="tab-btn" data-tab="cn">🀄 國語</button>
      <button class="tab-btn" data-tab="fav">⭐ 收藏</button>
      <button class="tab-btn" data-tab="plan">📅 學習計畫</button>
      <button class="tab-btn" data-tab="pet">🎮 養成遊戲</button>
    </div>
    <div class="mobile-theme">
      <button id="themeToggleMobile" style="padding:8px 16px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:14px;width:100%;">🌙 黑夜模式</button>
    </div>
  </div>
</div>

<div class="search-bar">
  <input id="searchInput" type="search" placeholder="🔍 模糊搜尋：英文可查單字/中文意思/句子(中英)，國語可查成語/解釋/造句">
</div>

<main>
  <section id="page-en" class="page active">
    <div class="section-title">🔤 英文單字 & 句子</div>
    <div class="filter-bar" id="alphaBar"></div>
    <div class="filter-bar" id="topicBar">
      <span class="filter-label">📑 句子主題：</span>
      <button class="topic-chip active" data-topic="">全部</button>
      <span id="topicChips"></span>
    </div>
    <div id="wordsList"></div>
  </section>

  <section id="page-cn" class="page">
    <div class="section-title">🀄 國語成語</div>
    <div class="filter-bar" id="catBar">
      <span class="filter-label">🗂 成語分類：</span>
      <button class="cat-chip active" data-cat="">全部</button>
      <span id="catChips"></span>
    </div>
    <div id="idiomsList"></div>
  </section>

  <section id="page-plan" class="page">
    <div class="section-title">📅 學習計畫</div>

    <!-- 建立計畫 -->
    <div class="card">
      <div style="font-size:16px;font-weight:700;margin-bottom:12px;">🆕 建立一個月的學習計畫</div>
      <div class="plan-form-row">
        <input type="text" id="planName" placeholder="計畫名稱（例如：八月衝刺）" style="min-width:180px;">
        <label>開始日期 <input type="date" id="planStart"></label>
        <label>天數 <input type="number" id="planDays" min="1" max="90" value="30" style="width:70px;"></label>
      </div>
      <div class="plan-config">
        <div class="plan-form-row">
          <label>🇺🇸 單字/日 <input type="number" id="planWordsPerDay" min="0" max="50" value="1" style="width:64px;"></label>
          <label>📝 句子/日 <input type="number" id="planSentPerDay" min="0" max="50" value="1" style="width:64px;"></label>
          <label>🀄 成語/日 <input type="number" id="planIdiomPerDay" min="0" max="50" value="1" style="width:64px;"></label>
          <span class="filter-label" style="margin-left:8px;">（0 = 不含此類）</span>
        </div>
        <div class="plan-form-row">
          <span class="filter-label">📑 句子主題：</span>
          <button class="topic-chip active" data-ptopic="">隨機/全部</button>
          <span id="planTopicChips"></span>
        </div>
        <div class="plan-form-row" style="font-size:12px;color:var(--muted);">
          ※ 單字來自所選主題（含該主題句子的單字）；句子從所選主題中隨機抽取；成語不受主題限制。
        </div>
      </div>
      <div class="plan-actions">
        <button class="primary-btn" id="btnCreatePlan">📝 建立計畫（隨機分配・不重複）</button>
        <span id="createMsg" style="font-size:13px;color:var(--muted);"></span>
      </div>
    </div>

    <!-- 匯出匯入 -->
    <div class="plan-toolbar">
      <button class="ghost-btn" id="btnImportCsv">📥 匯入 CSV</button>
      <input type="file" id="csvFile" accept=".csv,text/csv" style="display:none">
      <span id="importMsg" style="font-size:13px;color:var(--muted);"></span>
    </div>

    <div id="plansList"></div>
  </section>

  <section id="page-fav" class="page">
    <div class="section-title">⭐ 我的收藏</div>
    <div class="filter-bar" style="margin-bottom:8px;">
      <button class="ghost-btn active" id="favFilterAll" data-fav="all">全部</button>
      <button class="ghost-btn" id="favFilterWord" data-fav="word">🇺🇸 單字</button>
      <button class="ghost-btn" id="favFilterIdiom" data-fav="idiom">🀄 成語</button>
    </div>
    <div id="favList"></div>
  </section>

  <!-- 單字詳情 Modal -->
  <div id="wordModal" class="modal-overlay">
    <div class="modal-card" id="wordModalCard"></div>
  </div>

  <section id="page-pet" class="page">
    <div class="section-title">🎮 養成遊戲</div>
    <div id="petCard"></div>
    <div id="petQuiz"></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const statsEl = $('#stats'), wordsList = $('#wordsList'), idiomsList = $('#idiomsList'),
    FAV_KEY = 'dl_favorites_v1';
let allWords = [], allIdioms = [];

/* ================= 分頁（桌面 + 手機共用） ================= */
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll(`.tab-btn[data-tab="${tab}"]`).forEach(b => b.classList.add('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $('#page-' + tab).classList.add('active');
  if (tab === 'plan') loadPlans();
  if (tab === 'pet') renderPet();
  if (tab === 'fav') renderFavorites();
  // 關閉手機 drawer
  document.getElementById('mobileDrawer').classList.remove('open');
  document.getElementById('hamburger').textContent = '☰';
  // 關閉 word modal
  const m = document.getElementById('wordModal');
  if (m) m.classList.remove('open');
}
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => switchTab(btn.dataset.tab);
});

/* ================= 手機 hamburger ================= */
const hamburger = document.getElementById('hamburger');
const drawer = document.getElementById('mobileDrawer');
hamburger.addEventListener('click', () => {
  const open = drawer.classList.toggle('open');
  hamburger.textContent = open ? '✕' : '☰';
});

/* ================= 主題同步（桌面 + 手機） ================= */
function applyTheme(next) {
  document.documentElement.dataset.theme = next;
  localStorage.setItem('theme', next);
  const label = next === 'dark' ? '☀️ 白天模式' : '🌙 黑夜模式';
  document.getElementById('themeToggle').textContent = label;
  const tm = document.getElementById('themeToggleMobile');
  if (tm) tm.textContent = label;
}
// 頁面載入時還原上次主題
(function() {
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.dataset.theme = saved;
  const label = saved === 'dark' ? '☀️ 白天模式' : '🌙 黑夜模式';
  const te = document.getElementById('themeToggle');
  if (te) te.textContent = label;
  const tm = document.getElementById('themeToggleMobile');
  if (tm) tm.textContent = label;
})();
document.getElementById('themeToggle').onclick = () => {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
};
document.getElementById('themeToggleMobile') && (document.getElementById('themeToggleMobile').onclick = () => {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});
// 初始化主題按鈕文字
const savedTheme = localStorage.getItem('theme') || 'light';
document.documentElement.dataset.theme = savedTheme;
applyTheme(savedTheme);

/* ================= 收藏 CRUD ================= */
function getFavorites() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch { return []; }
}
function saveFavorites(arr) {
  localStorage.setItem(FAV_KEY, JSON.stringify(arr));
}
function toggleFav(type, id) {
  const fav = getFavorites();
  const key = type + '|' + id;
  const idx = fav.findIndex(f => f.key === key);
  if (idx >= 0) fav.splice(idx, 1); else fav.push({ key, type, id, addedAt: Date.now() });
  saveFavorites(fav);
  return idx < 0; // true = 新增, false = 移除
}
function isFav(type, id) {
  return getFavorites().some(f => f.type === type && f.id === id);
}

/* 收藏列表渲染 */
let favFilter = 'all';
function renderFavorites() {
  const fav = getFavorites();
  const favMap = {};
  fav.forEach(f => { favMap[f.type + '|' + f.id] = f; });

  const words = allWords.filter(w => favMap['word|' + w.id]);
  const idioms = allIdioms.filter(i => favMap['idiom|' + i.id]);

  const q = searchQ;
  const showWords = favFilter === 'all' || favFilter === 'word';
  const showIdioms = favFilter === 'all' || favFilter === 'idiom';

  const favWordCards = showWords ? words.map(w => {
    const sents = (w.sentences || []).map(s => `
      <div class="sentence">
        <div class="en">${highlight(s.sentence, q)} ${s.gtranslate_url ? `<a class="link-btn" href="${esc(s.gtranslate_url)}" target="_blank">🔊 聽整句</a>` : ''}${s.topic ? `<span class="topic-badge">${esc(s.topic)}</span>` : ''}</div>
        <div class="zh">${highlight(s.translation, q)}</div>
      </div>`).join('');
    return `<div class="card">
      <div class="word-head">
        <span class="word">${highlight(w.word, q)}</span>
        ${w.pos ? `<span class="pos">${esc(w.pos)}</span>` : ''}
        <span class="meaning">${highlight(w.meaning, q)}</span>
        <button class="mini-btn danger-btn" style="margin-left:auto;" onclick="doToggleFav('word',${w.id},this)">★ 已收藏</button>
      </div>
      ${sents}
    </div>`;
  }) : [];

  const favIdiomCards = showIdioms ? idioms.map(i => {
    const meaning = i.explanation ? `<div class="explanation">📖 ${highlight(i.explanation, q)}</div>` : '';
    const examples = i.example ? `<div class="example">${highlight(i.example, q)}</div>` : '';
    return `<div class="card">
      <div class="idiom-head">
        <span class="idiom">${highlight(i.idiom, q)}</span>
        ${i.category ? `<span class="cat-badge">${esc(i.category)}</span>` : ''}
        <button class="mini-btn danger-btn" style="margin-left:auto;" onclick="doToggleFav('idiom',${i.id},this)">★ 已收藏</button>
      </div>
      ${meaning}${examples}
    </div>`;
  }) : [];

  const html = [...favWordCards, ...favIdiomCards];
  $('#favList').innerHTML = html.length
    ? html.join('')
    : '<div class="empty">還沒有收藏內容，點擊任意單字或成語旁的 ☆ 即可收藏～</div>';
}

function doToggleFav(type, id, btn) {
  const added = toggleFav(type, id);
  btn.textContent = added ? '★ 已收藏' : '☆ 收藏';
  btn.className = added ? 'mini-btn danger-btn' : 'mini-btn';
  // 重新統計
  const fav = getFavorites();
  statsEl.textContent = `單字 ${allWords.length} · 句子 ${allWords.reduce((n,w)=>n+(w.sentences||[]).length,0)} · 成語 ${allIdioms.length} · ⭐ ${getFavorites().length}`;
}

// 收藏頁篩選按鈕
['favFilterAll','favFilterWord','favFilterIdiom'].forEach(id => {
  const btn = document.getElementById(id);
  if (btn) btn.onclick = () => {
    favFilter = btn.dataset.fav;
    ['favFilterAll','favFilterWord','favFilterIdiom'].forEach(x => {
      const b = document.getElementById(x);
      if (b) b.classList.toggle('active', x === id);
    });
    renderFavorites();
  };
});

/* ================= 搜尋（模糊）+ A-Z / 主題 / 分類篩選 ================= */
let searchQ = '';
let alphaFilter = '';   // A-Z 字母篩選
let topicFilter = '';   // 句子主題篩選
let catFilter = '';     // 成語分類篩選

$('#searchInput').addEventListener('input', e => {
  searchQ = e.target.value.trim().toLowerCase();
  renderWords(allWords);
  renderIdioms(allIdioms);
});

/* A-Z 快查列 */
function renderAlphaBar() {
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const available = new Set(allWords.map(w => w.word[0].toUpperCase()));
  $('#alphaBar').innerHTML =
    `<span class="filter-label">🔠 字母快查：</span>
     <button class="alpha-btn ${!alphaFilter ? 'active' : ''}" data-a="">全</button>` +
    letters.map(l =>
      `<button class="alpha-btn ${alphaFilter === l ? 'active' : ''}" data-a="${l}" ${available.has(l) ? '' : 'style="opacity:.35"'}>${l}</button>`
    ).join('');
  $('#alphaBar').querySelectorAll('.alpha-btn').forEach(b => b.onclick = () => {
    alphaFilter = b.dataset.a;
    renderAlphaBar();
    renderWords(allWords);
  });
}

/* 句子主題 chips */
function renderTopicBar() {
  const counts = {};
  allWords.forEach(w => (w.sentences || []).forEach(s => {
    const t = s.topic || '未分類';
    counts[t] = (counts[t] || 0) + 1;
  }));
  $('#topicChips').innerHTML = Object.keys(counts).map(t =>
    `<button class="topic-chip ${topicFilter === t ? 'active' : ''}" data-topic="${esc(t)}">${esc(t)} ${counts[t]}</button>`
  ).join('');
  $('#topicBar').querySelectorAll('.topic-chip').forEach(b => b.onclick = () => {
    topicFilter = b.dataset.topic;
    document.querySelectorAll('#topicBar .topic-chip').forEach(c => c.classList.toggle('active', c.dataset.topic === topicFilter));
    renderWords(allWords);
  });
}

/* 成語分類 chips */
function renderCatBar() {
  const counts = {};
  allIdioms.forEach(i => {
    const c = i.category || '未分類';
    counts[c] = (counts[c] || 0) + 1;
  });
  $('#catChips').innerHTML = Object.keys(counts).map(c =>
    `<button class="cat-chip ${catFilter === c ? 'active' : ''}" data-cat="${esc(c)}">${esc(c)} ${counts[c]}</button>`
  ).join('');
  $('#catBar').querySelectorAll('.cat-chip').forEach(b => b.onclick = () => {
    catFilter = b.dataset.cat;
    document.querySelectorAll('#catBar .cat-chip').forEach(c => c.classList.toggle('active', c.dataset.cat === catFilter));
    renderIdioms(allIdioms);
  });
}

function matchFields(q, ...fields) {
  return fields.some(f => (f || '').toLowerCase().includes(q));
}
function highlight(text, q) {
  const s = String(text == null ? '' : text);
  if (!q) return esc(s);
  const idx = s.toLowerCase().indexOf(q);
  if (idx < 0) return esc(s);
  return esc(s.slice(0, idx)) + '<span class="hit">' + esc(s.slice(idx, idx + q.length)) + '</span>' + esc(s.slice(idx + q.length));
}

/* ================= 資料載入 ================= */
async function loadAll() {
  try {
    const ts = '?t=' + Date.now();   // cache-busting：避免 CDN/瀏覽器快取舊版資料
    const [words, idioms] = await Promise.all([
      fetch('data/words.json' + ts).then(r => r.json()),
      fetch('data/idioms.json' + ts).then(r => r.json())
    ]);
    allWords = words; allIdioms = idioms;
    renderAlphaBar(); renderTopicBar(); renderCatBar();
    renderWords(words); renderIdioms(idioms); renderPickLists();
    const nSent = words.reduce((n, w) => n + (w.sentences || []).length, 0);
    const favCount = getFavorites().length;
    const txt = `單字 ${words.length} · 句子 ${nSent} · 成語 ${idioms.length} · ⭐ ${favCount}`;
    statsEl.textContent = txt;
    const sm = document.getElementById('statsMobile');
    if (sm) sm.textContent = txt;
    loadPlans();
    renderPet();
  } catch (e) {
    wordsList.innerHTML = `<div class="empty">載入失敗：${esc(e.message)}</div>`;
  }
}

function renderWords(words) {
  const q = searchQ;
  let filtered = words;
  // 搜尋
  if (q) filtered = filtered.filter(w =>
    matchFields(q, w.word, w.pos, w.meaning) ||
    (w.sentences || []).some(s => matchFields(q, s.sentence, s.translation))
  );
  // A-Z 字母篩選
  if (alphaFilter) filtered = filtered.filter(w => w.word[0].toUpperCase() === alphaFilter);
  // 句子主題篩選
  if (topicFilter) filtered = filtered.filter(w => (w.sentences || []).some(s => (s.topic || '未分類') === topicFilter));
  if (!filtered.length) { wordsList.innerHTML = '<div class="empty">沒有符合的單字～</div>'; return; }
  wordsList.innerHTML = filtered.map(w => {
    const sents = (w.sentences || []).map(s => `
      <div class="sentence">
        <div class="en">${highlight(s.sentence, q)} ${s.gtranslate_url ? `<a class="link-btn" href="${esc(s.gtranslate_url)}" target="_blank">🔊 聽整句</a>` : ''}${s.topic ? `<span class="topic-badge">${esc(s.topic)}</span>` : ''}</div>
        <div class="zh">${highlight(s.translation, q)}</div>
      </div>`).join('');
    const favd = isFav('word', w.id);
    return `
    <div class="card">
      <div class="word-head">
        <span class="word">${highlight(w.word, q)}</span>
        ${w.pos ? `<span class="pos">${esc(w.pos)}</span>` : ''}
        <span class="meaning">${highlight(w.meaning, q)}</span>
        <button class="mini-btn${favd ? ' danger-btn' : ''}" style="margin-left:auto;" onclick="doToggleFav('word',${w.id},this)">${favd ? '★ 已收藏' : '☆ 收藏'}</button>
        ${w.gtranslate_url ? `<a class="link-btn" href="${esc(w.gtranslate_url)}" target="_blank">🔊 發音</a>` : ''}
      </div>
      ${sents}
    </div>`;
  }).join('');
}

function renderIdioms(idioms) {
  const q = searchQ;
  let filtered = idioms;
  // 搜尋
  if (q) filtered = filtered.filter(i => matchFields(q, i.idiom, i.explanation, i.example));
  // 分類篩選
  if (catFilter) filtered = filtered.filter(i => (i.category || '未分類') === catFilter);
  if (!filtered.length) { idiomsList.innerHTML = '<div class="empty">沒有符合的成語～</div>'; return; }
  idiomsList.innerHTML = filtered.map(i => {
    const favd = isFav('idiom', i.id);
    return `
    <div class="card">
      <div class="idiom-head">
        <span class="idiom">${highlight(i.idiom, q)}</span>
        ${i.category ? `<span class="cat-badge">${esc(i.category)}</span>` : ''}
        <button class="mini-btn${favd ? ' danger-btn' : ''}" style="margin-left:auto;" onclick="doToggleFav('idiom',${i.id},this)">${favd ? '★ 已收藏' : '☆ 收藏'}</button>
      </div>
      <div class="explanation">📖 ${highlight(i.explanation, q)}</div>
      ${i.example ? `<div class="example">${highlight(i.example, q)}</div>` : ''}
    </div>`;
  }).join('');
}

/* ================= 學習計畫（IndexedDB） ================= */
const DB_NAME = 'daily-learning', DB_VER = 2;
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('plans'))
        db.createObjectStore('plans', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('pet'))
        db.createObjectStore('pet');
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function idbGetAll(store) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const rq = tx.objectStore(store).getAll();
    rq.onsuccess = () => res(rq.result || []);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbPut(store, val, key) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    if (key !== undefined) tx.objectStore(store).put(val, key);
    else tx.objectStore(store).put(val);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbDelete(store, key) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderPickLists() {
  renderPlanTopicChips();
}
function renderPlanTopicChips() {
  const counts = {};
  allWords.forEach(w => (w.sentences || []).forEach(s => {
    const t = s.topic || '未分類';
    counts[t] = (counts[t] || 0) + 1;
  }));
  $('#planTopicChips').innerHTML = Object.keys(counts).map(t =>
    `<button class="topic-chip" data-ptopic="${esc(t)}">${esc(t)} ${counts[t]}</button>`

  $('#planTopicChips').querySelectorAll('.topic-chip').forEach(b => b.onclick = () => {
    planTopicFilter = b.dataset.ptopic;
    document.querySelectorAll('#planTopicChips .topic-chip').forEach(c => c.classList.toggle('active', c.dataset.ptopic === planTopicFilter));
    const all = document.querySelector('[data-ptopic=""]');
    if (all) all.classList.toggle('active', planTopicFilter === '');

let planTopicFilter = '';

/* ================= 詳情 Modal（單字 + 成語通用） ================= */
function showDetailModal(type, key, fromPlan) {
  const m = document.getElementById('wordModal');
  const mc = document.getElementById('wordModalCard');
  let html = '';

  if (type === 'word') {

          ${s.topic ? `<span class="topic-badge">${esc(s.topic)}</span>` : ''}
        </div>

      </div>`).join('') || '<div class="empty">尚無例句</div>';
    html = `

      </div>

      </div>
      ${i.example ? `<div class="modal-sentences">

// 點擊 Modal 背景關閉
document.addEventListener('click', e => {

// 從計畫點擊 → 開啟詳情 Modal
function jumpToDetail(type, key) {

function buildPlan(name, startDate, days, wordsPerDay, sentPerDay, idiomPerDay, topicFilter) {
  // 根據主題過濾單字池（單字至少要有一句在該主題）
  let wordPool = allWords.filter(w =>
    topicFilter === '' || (w.sentences || []).some(s => (s.topic || '未分類') === topicFilter)
  );
  // 句子池
  let sentPool = [];
  if (sentPerDay > 0) {
    allWords.forEach(w => (w.sentences || []).forEach(s => {
      if (topicFilter === '' || (s.topic || '未分類') === topicFilter) {
        sentPool.push({ word: w.word, sentence: s.sentence, translation: s.translation, topic: s.topic || '未分類' });
      }
    }));
  }
  // 成語池
  const idiomPool = allIdioms;

  // 每天的 entry
  const entries = [];
  for (let d = 0; d < days; d++) {
    entries.push({ date: addDays(startDate, d), words: [], sentences: [], idioms: [] });
  }

  // 隨機分配
  shuffle(wordPool).slice(0, wordsPerDay * days).forEach((w, i) => entries[i % days].words.push({ word: w.word, done: false }));
  shuffle(sentPool).slice(0, sentPerDay * days).forEach((s, i) => entries[i % days].sentences.push({ word: s.word, sentence: s.sentence, translation: s.translation, topic: s.topic, done: false }));
  shuffle(idiomPool).slice(0, idiomPerDay * days).forEach((idm, i) => entries[i % days].idioms.push({ idiom: idm.idiom, done: false }));

  return {
    id: 'plan_' + Date.now() + '_' + Math.floor(Math.random() * 1e6),
    name, startDate, days, wordsPerDay, sentPerDay, idiomPerDay, topicFilter,
    createdAt: new Date().toISOString(),
    entries
  };
}

$('#btnCreatePlan').onclick = async () => {
  const name = $('#planName').value.trim() || '學習計畫';
  const start = $('#planStart').value || todayStr();
  const days = Math.min(90, Math.max(1, parseInt($('#planDays').value) || 30));
  const wordsPerDay = Math.max(0, parseInt($('#planWordsPerDay').value) || 0);
  const sentPerDay  = Math.max(0, parseInt($('#planSentPerDay').value)  || 0);
  const idiomPerDay = Math.max(0, parseInt($('#planIdiomPerDay').value) || 0);
  if (!wordsPerDay && !sentPerDay && !idiomPerDay) {
    $('#createMsg').textContent = '⚠️ 請至少填寫一項每日數量（> 0）';
    return;
  }
  const plan = buildPlan(name, start, days, wordsPerDay, sentPerDay, idiomPerDay, planTopicFilter);
  await idbPut('plans', plan);
  const topicHint = planTopicFilter ? `（主題：${planTopicFilter}）` : '（主題：隨機）';
  $('#createMsg').textContent = `✅ 已建立「${name}」：${days} 天，單字 ${wordsPerDay}×${days}=${wordsPerDay*days} 個、句子 ${sentPerDay}×${days}=${sentPerDay*days} 句、成語 ${idiomPerDay}×${days}=${idiomPerDay*days} 則 ${topicHint}`;
  loadPlans();
};

async function loadPlans() {
  const plans = (await idbGetAll('plans')).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  const el = $('#plansList');
  if (!plans.length) {
    el.innerHTML = '<div class="plan-empty">還沒有學習計畫～ 上方建立一個吧！</div>';
    return;
  }
  el.innerHTML = plans.map(plan => {
    const total = plan.entries.reduce((n, e) => n + (e.words||[]).length + (e.idioms||[]).length, 0);
    const done = plan.entries.reduce((n, e) => n + (e.words||[]).filter(w=>w.done).length + (e.idioms||[]).filter(i=>i.done).length, 0);
    const pct = total ? Math.round(done / total * 100) : 0;

    const rows = plan.entries.map(e => {
      const sentByWord = {};
      (e.sentences||[]).forEach(s => {
        if (!sentByWord[s.word]) sentByWord[s.word] = [];
        sentByWord[s.word].push(s);
      });
      const htmlParts = [];
      // 單字（點名稱開 Modal）
      (e.words||[]).forEach(w => {
        htmlParts.push(`
        <span class="day-item-group">
          <label class="day-item ${w.done ? 'done' : ''}" data-type="w" data-date="${esc(e.date)}" data-word="${esc(w.word)}">
            <input type="checkbox" ${w.done ? 'checked' : ''} data-type="w" data-date="${esc(e.date)}" data-word="${esc(w.word)}">
          </label>
          <span class="day-word-link" onclick="jumpToDetail('word','${esc(w.word)}')">${esc(w.word)}</span>
        </span>`);
      });
      // 成語（點名稱開 Modal）
      (e.idioms||[]).forEach(i => {
        htmlParts.push(`
        <span class="day-item-group">
          <label class="day-item ${i.done ? 'done' : ''}" data-type="i" data-date="${esc(e.date)}" data-idiom="${esc(i.idiom)}">
            <input type="checkbox" ${i.done ? 'checked' : ''} data-type="i" data-date="${esc(e.date)}" data-idiom="${esc(i.idiom)}">
          </label>
          <span class="day-word-link" onclick="jumpToDetail('idiom','${esc(i.idiom)}')">${esc(i.idiom)}</span>
        </span>`);
      });
      if (!htmlParts.length) return '';
      return `<div class="day-row">
        <span class="day-date">${e.date}</span>
        <span class="day-items">${htmlParts.join('')}</span>
      </div>`;
    }).join('');

    return `<div class="card plan-card" data-plan="${esc(plan.id)}">
      <div class="plan-head">
        <div>
          <span class="plan-name">${esc(plan.name)}</span>
          <span class="plan-meta">　${esc(plan.startDate)} 起 ${plan.days} 天 ｜ 完成 ${done}/${total}（${pct}%）${plan.topicFilter ? '｜📑'+esc(plan.topicFilter) : ''}</span>
        </div>
        <div class="plan-ctrl">
          <button class="ghost-btn" data-exp="${esc(plan.id)}">${plan._open ? '收合' : '展開'}每日進度</button>
          <button class="ghost-btn" data-export="${esc(plan.id)}">⬇️ 匯出 CSV</button>
          <button class="danger-btn" data-del="${esc(plan.id)}">🗑 刪除</button>
        </div>
      </div>
      <div class="progress"><div style="width:${pct}%"></div></div>
      <div class="plan-days" style="${plan._open ? '' : 'display:none'}">${rows}</div>
    </div>`;
  }).join('');

  el.querySelectorAll('[data-exp]').forEach(b => b.onclick = async () => {
    const p = (await idbGetAll('plans')).find(x => x.id === b.dataset.exp);
    p._open = !p._open;
    await idbPut('plans', p);
    loadPlans();
  });
  el.querySelectorAll('[data-export]').forEach(b => b.onclick = () => exportPlanCsv(b.dataset.export));
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('確定刪除這個學習計畫？')) return;
    await idbDelete('plans', b.dataset.del);
    loadPlans();
  });
  // 單字勾選（自動完成所有句子，或各自獨立）
  el.querySelectorAll('input[data-type="w"]').forEach(cb => cb.onchange = async () => {
    const date = cb.dataset.date, word = cb.dataset.word;
    const planId = cb.closest('.plan-card').dataset.plan;
    const plans = await idbGetAll('plans');
    const plan = plans.find(x => x.id === planId);
    const en = plan.entries.find(e => e.date === date);
    const it = (en.words||[]).find(w => w.word === word); if (it) it.done = cb.checked;
    await idbPut('plans', plan);
    loadPlans();
  });
  // 成語勾選
  el.querySelectorAll('input[data-type="i"]').forEach(cb => cb.onchange = async () => {
    const date = cb.dataset.date, idiom = cb.dataset.idiom;
    const planId = cb.closest('.plan-card').dataset.plan;
    const plans = await idbGetAll('plans');
    const plan = plans.find(x => x.id === planId);
    const en = plan.entries.find(e => e.date === date);
    const it = (en.idioms||[]).find(i => i.idiom === idiom); if (it) it.done = cb.checked;
    await idbPut('plans', plan);
    loadPlans();
  });
  // 監聽 Modal 裡的「完成學習」廣播（單字 + 成語，事件代理，僅綁一次）
  document.getElementById('plansList').addEventListener('plan-done', async (e) => {
    const { type, key } = e.detail;
    const planId = $('#plansList').querySelector('.plan-card') ? (await idbGetAll('plans'))[0]?.id : null;
    // 廣播事件不含 planId，改用目前展開的第一張卡片（用 find 找有 _open 的那張）
    const plans = await idbGetAll('plans');
    const plan = plans.find(p => p._open) || plans[0];
    if (!plan) return;
    let changed = false;
    plan.entries.forEach(en => {
      if (type === 'word') {
        const wi = (en.words||[]).find(w => w.word === key);
        if (wi) { wi.done = true; changed = true; }
      } else if (type === 'idiom') {
        const ii = (en.idioms||[]).find(o => o.idiom === key);
        if (ii) { ii.done = true; changed = true; }
      }
    });
    if (changed) { await idbPut('plans', plan); loadPlans(); }
  }, true);
}

/* ================= 養成遊戲（電子雞/狗/猫） ================= */
const PET_TYPES = {
  chicken: { name: '電子雞', emoji: ['🥚', '🐣', '🐔', '🎉'], maxLv: 30, hungerDecay: 8, funDecay: 10 },
  dog:     { name: '電子狗', emoji: ['🐶', '🐕', '🦮'], maxLv: 30, hungerDecay: 6, funDecay: 8 },
  cat:     { name: '電子貓', emoji: ['🐱', '🐈', '🐈⬛'], maxLv: 30, hungerDecay: 5, funDecay: 7 }
};
const PET_STORE = 'pet';

function fmtDay(d) {
  const dt = new Date(d);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function todayKey() { return fmtDay(Date.now()); }

function defaultPet(type) {
  return { type, name: { chicken:'小雞', dog:'小狗', cat:'小貓' }[type], lv: 1, xp: 0, hunger: 100, fun: 100, fed: 0, played: 0, correct: 0, wrong: 0, lastFedDay: null, lastPlayedDay: null, createdAt: Date.now() };
}

function stageEmoji(p) {
  const t = PET_TYPES[p.type];
  if (p.lv >= 10) return t.emoji[t.emoji.length - 1];
  if (p.lv >= 5) return t.emoji[Math.min(1, t.emoji.length - 2)];
  return t.emoji[0];
}

function xpMultiplier(p) {
  // 等級加權：Lv2 = 1.1 倍、Lv3 = 1.2 倍 ... 每升一等 +0.1
  return 1 + (Math.max(1, p.lv) - 1) * 0.1;
}

async function getPet(type) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(PET_STORE, 'readonly');
    const rq = tx.objectStore(PET_STORE).get('pet_' + type);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror = () => rej(rq.error);
  });
}

    if (p) return t;

  return null;
}

            <option value="word">🇺🇸 英文單字（英文→中文）</option>
            <option value="sentence">🇺🇸 英文句子（中文→英文）</option>
            <option value="idiom">🀄 國語成語（解釋→成語）</option>
          </select>
        </label>
        <label>題數
          <input type="number" id="quizCount" min="1" max="50" value="5" style="width:70px;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;">

    showQuiz(qs, _quizPetType);
  };

function buildQuiz(seed) {
  const type = $('#quizType').value;
  const count = Math.min(50, Math.max(1, parseInt($('#quizCount').value) || 5));
  const qs = [];
  if (type === 'word') {
    const pool = shuffle(seed.words);
    for (let i = 0; i < count; i++) {
      const w = pool[i % pool.length];
      const others = shuffle(seed.words.filter(x => x.word !== w.word)).slice(0, 3);
      if (others.length < 3) continue;
      const opts = shuffle([w, ...others]).map(x => x.meaning || x.word);
      qs.push({ q: w.word, opts, ans: w.meaning || w.word, tag: '單字' });
    }
  } else if (type === 'sentence') {
    const sents = [];
    seed.words.forEach(w => (w.sentences || []).forEach(s => sents.push({ s, w })));
    const pool = shuffle(sents);
    for (let i = 0; i < count; i++) {
      const it = pool[i % pool.length];
      const others = shuffle(sents.filter(x => x !== it)).slice(0, 3);
      if (others.length < 3) continue;
      const opts = shuffle([it, ...others]).map(x => x.s.sentence);
      qs.push({ q: it.s.translation, opts, ans: it.s.sentence, tag: '句子' });
    }
  } else {
    const pool = shuffle(seed.idioms);
    for (let i = 0; i < count; i++) {
      const idm = pool[i % pool.length];
      const others = shuffle(seed.idioms.filter(x => x.idiom !== idm.idiom)).slice(0, 3);
      if (others.length < 3) continue;
      const opts = shuffle([idm, ...others]).map(x => x.idiom);
      qs.push({ q: idm.explanation, opts, ans: idm.idiom, tag: '成語' });
    }
  }
  return qs;
}

function showQuiz(qs, petType) {
  let idx = 0, score = 0;
  const area = $('#quizArea');
  function renderQ() {
    if (idx >= qs.length) return showResult(score, qs.length);
    const q = qs[idx];
    area.innerHTML = `
      <div class="quiz-progress"><div style="width:${idx / qs.length * 100}%"></div></div>
      <div style="font-size:13px;color:var(--muted);">第 ${idx + 1} / ${qs.length} 題（${q.tag}）</div>
      <div class="quiz-prompt">${esc(q.q)}</div>
      ${q.opts.map((o, oi) => `<button class="option-btn" data-oi="${oi}">${esc(o)}</button>`).join('')}`;
    area.querySelectorAll('.option-btn').forEach(btn => btn.onclick = async () => {
      const chosen = q.opts[+btn.dataset.oi];
      const ok = chosen === q.ans;
      area.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
      area.querySelectorAll('.option-btn').forEach(b => {
        if (q.opts[+b.dataset.oi] === q.ans) b.classList.add('correct');
        else if (+b.dataset.oi === +btn.dataset.oi) b.classList.add('wrong');
      });
      if (ok) { score++; await addXp(1, petType); }
      else { await addWrong(petType); }
      setTimeout(() => { idx++; renderQ(); }, 900);
    });
  }
  renderQ();
}

async function addXp(n, type) {
  const p = await getPet(type);
  if (!p) return;
  const gain = n * xpMultiplier(p);   // 加權：Lv2=1.1x、Lv3=1.2x...
  p.xp += gain; p.correct++;
  const t = PET_TYPES[p.type];
  while (p.xp >= p.lv * 10 && p.lv < t.maxLv) { p.xp -= p.lv * 10; p.lv++; }
  if (p.lv >= t.maxLv) p.xp = Math.min(p.xp, p.lv * 10);
  await idbPut(PET_STORE, p, 'pet_' + p.type);
}

async function addWrong(type) {
  const p = await getPet(type);
  if (!p) return;
  p.wrong++;
  await idbPut(PET_STORE, p, 'pet_' + p.type);
}

async function showResult(score, total, petType) {
  const p = await getPet(petType);
  const t = PET_TYPES[p.type];
  const perfect = score === total && total > 0;
  $('#quizArea').innerHTML = `
    <div class="result-card">
      <div style="font-size:52px;">${perfect ? '🏆' : score >= total * 0.6 ? '🎉' : '💪'}</div>
      <div style="font-size:22px;font-weight:700;margin:8px 0;">${score} / ${total} 題答對</div>
      <div style="font-size:14px;color:var(--muted);margin-bottom:12px;">${perfect ? '太完美了！全對！' : score >= total * 0.6 ? '很棒！繼續加油！' : '別灰心，再試一次！'}</div>
      <button class="primary-btn" id="btnAgain">🔁 再玩一次</button>
    </div>`;
  $('#btnAgain').onclick = startQuiz;
  renderPet();
}

let _quizPetType = null;

function startQuiz() {
  const qs = buildQuiz({ words: allWords, idioms: allIdioms });
  if (!qs.length) { $('#quizArea').innerHTML = '<div class="empty">題庫不足（至少需要 4 個單字/句子/成語才能出四選一）</div>'; return; }
  if (!_quizPetType) return;
  showQuiz(qs, _quizPetType);
}

/* ================= CSV 匯出 / 匯入 ================= */
function csvEscape(v) {
  v = String(v == null ? '' : v);
  return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function downloadCsv(filename, text) {
  const blob = new Blob(['\uFEFF' + text], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
async function exportPlanCsv(planId) {
  const plans = await idbGetAll('plans');
  const plan = plans.find(x => x.id === planId);
  if (!plan) return;
  const rows = [['計畫名稱', '日期', '類型', '項目', '完成']];
  plan.entries.forEach(e => {
    (e.words||[]).forEach(w => rows.push([plan.name, e.date, '單字', w.word, w.done ? '是' : '否']));
    (e.sentences||[]).forEach(s => rows.push([plan.name, e.date, '句子', s.word + ': ' + s.sentence + ' / ' + s.translation, s.done ? '是' : '否']));
    (e.idioms||[]).forEach(i => rows.push([plan.name, e.date, '成語', i.idiom, i.done ? '是' : '否']));
  });
  downloadCsv('學習計畫_' + plan.name + '.csv', rows.map(r => r.map(csvEscape).join(',')).join('\r\n'));
}

function parseCsv(text) {
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch !== '\r') cur += ch;
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

$('#btnImportCsv').onclick = () => $('#csvFile').click();
$('#csvFile').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  try {
    const rows = parseCsv(text).filter(r => r.length >= 4 && r[0].trim() && r[0].trim() !== '計畫名稱');
    if (!rows.length) throw new Error('CSV 內容為空或格式不符');
    const byName = {};
    rows.forEach(r => {
      const name = r[0].trim(), date = (r[1] || '').trim(), type = (r[2] || '').trim(), item = (r[3] || '').trim();
      const done = (r[4] || '').trim() === '是';
      (byName[name] = byName[name] || []).push({ date, type, item, done });
    });
    let count = 0;
    for (const [name, list] of Object.entries(byName)) {
      const dates = [...new Set(list.map(r => r.date))].sort();
      const entries = dates.map(d => ({ date: d, words: [], idioms: [] }));
      list.forEach(r => {
        const en = entries.find(x => x.date === r.date);
        if (r.type === '單字') en.words.push({ word: r.item, done: r.done });
        else en.idioms.push({ idiom: r.item, done: r.done });
      });
      await idbPut('plans', {
        id: 'plan_' + Date.now() + '_' + count,
        name, startDate: dates[0] || todayStr(), days: dates.length,
        createdAt: new Date().toISOString(), entries
      });
      count++;
    }
    $('#importMsg').textContent = `✅ 已匯入 ${count} 個學習計畫`;
    loadPlans();
  } catch (err) {
    $('#importMsg').textContent = '❌ 匯入失敗：' + err.message;
  }
  e.target.value = '';
};

/* ================= 工具 ================= */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

$('#planStart').value = todayStr();
loadAll();
